model:
  _target_: sklearn.linear_model.LogisticRegression

  # Используем стандартный solver для L2-регуляризации.
  solver: lbfgs

  # Максимальное число итераций для сходимости solver.
  max_iter: 300

  # Лучший C = 0.1

search:
  # Перебираем силу, обратную регуляризации.
  C:
    - 0.01
    - 0.1
    - 1.0
    - 10.0
    - 100.0