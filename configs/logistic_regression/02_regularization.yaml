model:
  _target_: sklearn.linear_model.LogisticRegression

  # Подходящий solver для обычной L2-регуляризации.
  solver: lbfgs

  # Стартовое значение до подбора регуляризации.
  C: 1.0

  # Верхняя граница итераций оптимизатора.
  # Это не число эпох: обучение завершится раньше при сходимости.
  max_iter: 300

search:
  # Значения C, проверенные на одинаковых CV-фолдах.
  C:
    - 0.01
    - 0.1
    - 1.0
    - 10.0
    - 100.0
