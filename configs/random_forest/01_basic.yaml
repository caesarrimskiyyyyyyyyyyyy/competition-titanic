model:
  _target_: sklearn.ensemble.RandomForestClassifier

  # Количество деревьев в ансамбле.
  n_estimators: 500

  # Критерий качества разбиения.
  criterion: gini

  # Пока не ограничиваем глубину деревьев.
  max_depth: null

  # Минимальное число объектов для разбиения узла.
  min_samples_split: 2

  # Минимальное число объектов в листе.
  min_samples_leaf: 1

  # Число признаков, рассматриваемых при разбиении.
  max_features: sqrt

  # Дополнительные веса классов пока не используем.
  class_weight: null

  # Фиксируем случайность для воспроизводимости.
  random_state: 42

  # Используем все доступные ядра процессора.
  n_jobs: -1