model:
  _target_: sklearn.ensemble.RandomForestClassifier

  # Количество деревьев фиксируем: больше деревьев
  # повышает устойчивость, но не ограничивает переобучение.
  n_estimators: 500

  # Стартовые параметры до поиска.
  max_depth: null
  min_samples_leaf: 1
  max_features: sqrt

  # Фиксируем случайное построение деревьев,
  # чтобы результаты экспериментов воспроизводились.
  random_state: 42

  # Параллелизм выполняет GridSearchCV.
  # Не запускаем второй параллелизм внутри каждого леса.
  n_jobs: 1

search:
  # Ограничиваем глубину отдельных деревьев.
  max_depth:
    - 4
    - 6
    - 8
    - 10
    - 12
    - 16
    - null

  # Увеличение листа сглаживает дерево
  # и не позволяет ему запоминать единичных пассажиров.
  min_samples_leaf:
    - 1
    - 2
    - 4
    - 8

  # Число признаков, доступных дереву при каждом разделении.
  # sqrt создаёт более разные деревья, null использует все признаки.
  max_features:
    - sqrt
    - 0.5
    - null
